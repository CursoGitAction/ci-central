name: Demo OIDC AWS

on:
  workflow_dispatch:

permissions:
  id-token: write 
  contents: read

jobs:
  conectar-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Autenticar con AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verificar identidad temporal
        run: aws sts get-caller-identity

      - name: Listar archivos de S3
        run: aws s3 ls s3://demo-oidc-github-curso-git-action