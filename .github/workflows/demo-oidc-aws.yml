name: Demo AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probar-conexion:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener credenciales temporales desde AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Verificar identidad asumida
        run: aws sts get-caller-identity

      - name: Leer archivo desde S3
        run: |
          aws s3 ls s3://${{ vars.AWS_BUCKET_NAME }}
          aws s3 cp s3://${{ vars.AWS_BUCKET_NAME }}/prueba.txt -