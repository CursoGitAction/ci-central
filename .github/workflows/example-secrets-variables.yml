name: Example Secrets and Variables

on:
  workflow_dispatch:

jobs:
  mostrar-secret-y-variable:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir Variables
        env:
          VAR_REPOSITORY: ${{ vars.PRIMER_VARIABLE }}
        run: |
          echo "--- Mostrando Variables ---"
          echo "El valor de PRIMER_VARIABLE es: $VAR_REPOSITORY"

      - name: Imprimir Secret
        env:
          SECRET_REPOSITORY: ${{ secrets.PRIMER_SECRETO }}
        run: |
          echo "--- Mostrando Secret ---"
          echo "El valor de PRIMER_SECRETO es: $SECRET_REPOSITORY"