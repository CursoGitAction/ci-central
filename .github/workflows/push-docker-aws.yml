name: Push Docker AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  push-docker-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticarnos en AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad asumida
        run: aws sts get-caller-identity

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY_NAME }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Verificar imagen en AWS ECR
        run: aws ecr describe-images --repository-name ${{ vars.AWS_ECR_REPOSITORY_NAME }}

      - name: Deploy to AWS ECS
        run: |
          aws ecs update-service \
            --cluster ${{ vars.AWS_ECS_CLUSTER_NAME }} \
            --service ${{ vars.AWS_ECS_SERVICE_NAME }} \
            --force-new-deployment
            --region ${{ vars.AWS_REGION }}