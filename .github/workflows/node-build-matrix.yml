name: Node Build Matrix

on:
  workflow_call:
    inputs:
      build-script:
        required: false
        type: string
        default: 'build'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.matrix }}
    steps:
      - name: Set matrix targets
        id: set-targets
        run: echo "matrix=[\"ubuntu-latest\", \"windows-latest\"]" >> $GITHUB_OUTPUT


  build:
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.setup-matrix.outputs.targets)}}
        node-version: [18, 20, 22]
        exclude:
          - os: ubuntu-latest
            node-version: 22
        include:
          - os: windows-latest
            node-version: 24


    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm install

      - name: Correr Linter y Tests
        run: |
          npm run lint --if-present

      - name: Ejecutar build
        run: npm run ${{ inputs.build-script }}