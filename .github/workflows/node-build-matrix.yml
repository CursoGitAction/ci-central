name: Node Build Matrix

on:
  workflow_call:
    inputs:
      build-script:
        required: false
        type: string
        default: 'build'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm install

      - name: Correr Linter y Tests
        run: |
          npm run lint --if-present

      - name: Ejecutar build
        run: npm run ${{ inputs.build-script }}